# NOIR Web 静态部署
# 职责: 提供 SPA 回退, WASM MIME, 长缓存, HTTPS 重定向和安全头
# 约束: 必须使用有效证书; WebUSB 只在 HTTPS 或 localhost 安全上下文可用
# 用法: 将 web/dist/* 部署到 /var/www/noir-web, 将本文件安装到 nginx conf.d 后 nginx -t

server {
    listen 80;
    listen [::]:80;
    server_name noir.example.com;
    server_tokens off;

    # certbot webroot 续期，不重定向 ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name noir.example.com;
    server_tokens off;

    root /var/www/noir-web;
    index index.html;
    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/noir.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noir.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/noir.example.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /sw-manifest.json {
        expires -1;
    }

    location = /robots.txt {
        expires 1h;
    }

    location = /llms.txt {
        expires 1h;
    }

    location /assets/ {
        expires 1y;
    }

    location /rules/ {
        expires 1h;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 1y;
    }

    gzip on;
    gzip_static on;
    gzip_vary on;
    # brotli_static on; # 需要 ngx_brotli 模块，开启后配合构建生成的 .br
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/wasm application/xml image/svg+xml;

    # 安全头放在 server 级别；不要在 location 再写 add_header，否则 nginx 不会继承这些头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "usb=(self)" always;
    add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
